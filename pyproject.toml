[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "am_segmentation_manager"
version = "0.0.0"
description = "Manage Autolamella FIB/SEM segmentation projects: indexing, metadata and label management."
readme = "README.md"
authors = [ { name = "Your Name", email = "you@example.com" } ]
license = { text = "MIT" }
keywords = ["FIB-SEM", "segmentation", "autolamella", "microscopy"]
classifiers = ["Programming Language :: Python :: 3"]

# Minimal runtime dependencies. Heavy image-processing deps are optional extras.
dependencies = [
  "PyYAML>=5.4",
  "pandas>=1.0"
]

[project.optional-dependencies]
all = [
  "numpy",
  "tifffile",
  "imagecodecs",
  "opencv-python",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["am_segmentation_manager*"]
