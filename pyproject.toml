[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "am_segmentation_manager"
version = "0.0.0"
description = "Manage Autolamella FIB/SEM segmentation projects: indexing, metadata and label management."
readme = "README.md"
authors = [ { name = "Casper Berger", email = "casper.berger@rfi.ac.uk" } ]
keywords = ["FIB-SEM", "segmentation", "autolamella", "microscopy"]

# No license field. The package previously declared MIT with no LICENSE file,
# which is a licence grant that was never actually decided on. Undeclared means
# the default -- all rights reserved -- which is the accurate state while the
# question is open. Choosing a licence (and whether the copyright holder is the
# author or the Rosalind Franklin Institute) is deferred; see
# docs/00_roadmap.md, "Before publishing".
#
# "Private :: Do Not Upload" is not a real classifier to PyPI: it rejects any
# upload carrying it. That is deliberate belt-and-braces against an accidental
# `twine upload` while the package is unlicensed and unpublished.
classifiers = [
  "Programming Language :: Python :: 3",
  "Private :: Do Not Upload",
]

# Minimal runtime dependencies. Heavy image-processing deps are optional extras.
dependencies = [
  "PyYAML>=5.4",
]

[project.optional-dependencies]
# For a pip-only installation. In the conda environment from environment.yml
# these are already provided by conda, and installing them again from PyPI
# gives you two cv2 installations -- conda's `opencv` and pip's
# `opencv-python` -- which breaks the import.
all = [
  "numpy",
  "tifffile",
  "imagecodecs",
  "opencv-python",
  "matplotlib",
]
# Charts alone, for a command-line install that wants `stats --plot` and
# nothing else. matplotlib is in `all` and `gui` as well: against the ~250 MB
# those already install for OpenCV and Qt, its own ~50 MB is not what makes an
# environment large, and charting is not a feature worth having to discover a
# second install command to reach. The core stays near-stdlib, and every
# statistics command still declines to plot rather than failing when it is
# absent.
plots = [
  "matplotlib",
]
# The curation window. PySide6 is the binding this is developed and tested
# against; qtpy adapts to whichever is present, but two in one process crash at
# import. Give this package an environment of its own rather than dropping it
# into one that already has a binding.
gui = [
  "qtpy",
  "PySide6",
  "numpy",
  "tifffile",
  "imagecodecs",
  "opencv-python",
  "matplotlib",
]
# The window's Qt binding without the image stack, for an environment that
# already has one. `gui` names opencv-python, and an environment holding
# opencv-python-headless (which albumentations requires, so every inference
# environment has it) must not also get that: two providers of cv2 is the
# hazard this file warns about throughout. So the inference environment takes
# `ml` for the image stack and `qt` for the window.
#
# Headless is in fact the better pairing with PySide6: opencv-python bundles Qt
# plugins of its own, and headless is the build with those left out.
qt = [
  "qtpy",
  "PySide6",
  "matplotlib",
]
# Inference: producing predictions from a trained model. Several gigabytes,
# which is why it is an extra and why scripts/setup_ml.sh puts it in its own
# environment rather than adding it to the one you curate in.
#
# NEVER install this beside `all`, `gui`, or conda's `opencv`. albumentations
# requires opencv-python-headless, which provides cv2 just as opencv-python
# does; an environment holding both has an import that fails. The image stack
# is listed here rather than reused from `all` precisely so that this extra
# names the headless build and can stand alone.
#
# Deliberately unpinned. Which torch build is right depends on the machine's
# GPU, so pinning one here would be wrong somewhere; setup_ml.sh takes an
# index URL instead. The architecture a checkpoint was trained with is
# recovered from the checkpoint, not from a version pin.
ml = [
  "numpy",
  "tifffile",
  "imagecodecs",
  "opencv-python-headless",
  "torch",
  "torchvision",
  "segmentation-models-pytorch",
  "albumentations",
]

[project.scripts]
am-seg = "am_segmentation_manager.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["am_segmentation_manager*"]

[tool.setuptools.package-data]
# The default segmentation class definitions, used when no project-specific
# segmentation_config_AM.yaml is found, and the window's icon. Both ship inside
# the package rather than at the repository root, so they survive installation.
# The .ico is not loaded by the GUI -- Qt uses the PNG on every platform -- and
# is kept for building a Windows shortcut.
am_segmentation_manager = ["data/*.yaml", "data/*.png", "data/*.ico"]

[tool.pytest.ini_options]
# Put src/ on the import path, so the tests run against the source tree without
# the package needing to be installed first. This is the supported way to do it;
# the tests previously each inserted src/ into sys.path by hand.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

# A verbatim copy of AM_training's module, kept byte-identical so it can be
# diffed against upstream. Linting it would report import order and trailing
# whitespace we must not fix: the moment this package reformats it, "is this
# still the same preprocessing the model was trained with?" stops being a
# question `diff` can answer. Not ours to lint, so not linted.
extend-exclude = [
  "src/am_segmentation_manager/ml/preprocessing.py",
]

[tool.ruff.lint]
# Deliberately a small set. Starting from "every rule ruff has" produces
# hundreds of findings that are mostly style opinions, and the useful ones then
# get lost. These four are the ones that catch real mistakes:
#   E, W  pycodestyle    -- whitespace and formatting errors
#   F     pyflakes       -- unused imports and names, undefined references
#   I     isort          -- import ordering, so diffs stay small
#   UP    pyupgrade      -- syntax made obsolete by the minimum Python version
# Add rules when a class of bug turns up that one would have caught.
select = ["E", "W", "F", "I", "UP"]

# E501 (line too long) is deliberately off for now. The code was not written to
# a column limit, and turning it on reports 55 lines that are not bugs -- which
# is how a linter trains you to stop reading its output. The goal is that
# `ruff check` reports nothing, so that anything it does report is worth acting
# on. Adopting E501 later means one reflow pass; `line-length` above is already
# set, so `ruff format` would do most of it.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Availability probes: the import *is* the test, so it is unused by design.
# Both already carry noqa comments; this makes the intent declarative.
"src/am_segmentation_manager/io/image.py" = ["F401"]
"src/am_segmentation_manager/operations/label_io.py" = ["F401"]
# Re-export surfaces: names are imported to be part of the public API.
"src/am_segmentation_manager/__init__.py" = ["F401"]
"src/am_segmentation_manager/operations/__init__.py" = ["F401"]
