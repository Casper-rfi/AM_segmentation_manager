[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-milling-seg"
version = "0.1.0.dev0"
description = "Manage Autolamella FIB/SEM segmentation projects: indexing, metadata and label management."
readme = "README.md"
authors = [ { name = "Casper Berger", email = "casper.berger@rfi.ac.uk" } ]
keywords = ["FIB-SEM", "segmentation", "autolamella", "microscopy"]

requires-python = ">=3.11"

# An SPDX expression, which needs setuptools 77. No `License ::` classifier
# beside it: setuptools refuses both. THIRD_PARTY_NOTICES.md ships in the wheel
# because the MIT licence of the code it lists requires its notice in every copy.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

# "Private :: Do Not Upload" is not a real classifier to PyPI: it rejects any
# upload carrying it, guarding against an accidental `twine upload` until the
# first release is ready. Remove it as part of that release.
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Private :: Do Not Upload",
]

# Minimal runtime dependencies. Heavy image-processing deps are optional extras.
dependencies = [
  "PyYAML>=5.4",
]

# Every extra names OpenCV's headless build, and only that one: opencv-python
# beside it would be a second provider of cv2, which breaks the import. Nothing here opens OpenCV's own windows, and the
# headless build carries none of the Qt plugins that would compete with
# PySide6's. Extras therefore combine freely -- `gui` and `ml` together is the
# whole workflow.
[project.optional-dependencies]
# The image stack for the command line, without the window.
all = [
  "numpy",
  "tifffile",
  "imagecodecs",
  "opencv-python-headless",
  "matplotlib",
]
# Charts alone, for a command-line install that wants `stats --plot` and
# nothing else. matplotlib is in `all` and `gui` as well: against the ~250 MB
# those already install for OpenCV and Qt, its own ~50 MB is not what makes an
# environment large, and charting is not a feature worth having to discover a
# second install command to reach. The core stays near-stdlib, and every
# statistics command still declines to plot rather than failing when it is
# absent.
plots = [
  "matplotlib",
]
# The curation window. PySide6 is the binding this is developed and tested
# against; qtpy adapts to whichever is present, but two in one process crash at
# import.
gui = [
  "qtpy",
  "PySide6",
  "numpy",
  "tifffile",
  "imagecodecs",
  "opencv-python-headless",
  "matplotlib",
]
# Inference: producing predictions from a trained model. Several gigabytes,
# which is why it is an extra.
#
# Unpinned here; the lock file records the versions tested. Which torch build
# a platform receives is set in [tool.uv.sources] below. The architecture a
# checkpoint was trained with is recovered from the checkpoint, not from a
# version pin.
ml = [
  "numpy",
  "tifffile",
  "imagecodecs",
  "opencv-python-headless",
  "torch",
  "torchvision",
  "segmentation-models-pytorch",
]
# The same set, taking torch built for CUDA 13 instead: a card newer than the
# CUDA 12.6 build's kernels -- a 50-series among them -- runs on nothing that
# build carries. Installed *instead of* `ml`, never beside it, because the two
# name one torch from two indexes; uv refuses both at once, and
# `test_the_two_inference_extras_install_the_same_package_set` keeps this list
# in step with that one.
ml-cuda13 = [
  "numpy",
  "tifffile",
  "imagecodecs",
  "opencv-python-headless",
  "torch",
  "torchvision",
  "segmentation-models-pytorch",
]

# Tools for working on the package, installed by `uv sync` and never by a user's
# `pip install`.
[dependency-groups]
dev = [
  "pytest",
  "ruff",
  "mypy",
]

# Shown on PyPI beside the release, and fixed with it: a released version's
# metadata cannot be changed afterwards.
[project.urls]
Homepage = "https://github.com/Casper-rfi/AM_segmentation_manager"
Documentation = "https://github.com/Casper-rfi/AM_segmentation_manager/blob/main/guides/user_guide.md"
Issues = "https://github.com/Casper-rfi/AM_segmentation_manager/issues"
Changelog = "https://github.com/Casper-rfi/AM_segmentation_manager/blob/main/CHANGELOG.md"

[project.scripts]
am-seg = "am_segmentation_manager.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["am_segmentation_manager*"]

[tool.setuptools.package-data]
# The default segmentation class definitions, used when no project-specific
# segmentation_config_AM.yaml is found, and the window's icon. Both ship inside
# the package rather than at the repository root, so they survive installation.
# The .icns is the mark in the macOS icon container, and is the application
# icon on that platform only; the PNG is the mark itself, used everywhere else
# and wherever the window draws it against its own background. The .ico is not
# loaded by the GUI: it is the icon of the Windows shortcut `create-shortcut`
# writes. The .svg is
# the artwork the .icns is built from and is wanted only by a rebuild, so it is
# committed beside them and deliberately left out of the install. The arrow
# images are the exception among the SVGs: the stylesheet draws dropdown and
# spin box arrows from them, so they are named here and ship.
am_segmentation_manager = [
    "data/*.yaml", "data/*.png", "data/*.ico", "data/*.icns", "data/arrow_*.svg",
]

[tool.pytest.ini_options]
# The source tree and the standalone scripts on the import path, so the tests run
# without the package installed and can import the scripts they test.
pythonpath = ["src", "scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
# Deliberately a small set. Starting from "every rule ruff has" produces
# hundreds of findings that are mostly style opinions, and the useful ones then
# get lost. These four are the ones that catch real mistakes:
#   E, W  pycodestyle    -- whitespace and formatting errors
#   F     pyflakes       -- unused imports and names, undefined references
#   I     isort          -- import ordering, so diffs stay small
#   UP    pyupgrade      -- syntax made obsolete by the minimum Python version
# Add rules when a class of bug turns up that one would have caught.
select = ["E", "W", "F", "I", "UP"]

# E501 (line too long) is deliberately off for now. The code was not written to
# a column limit, and turning it on reports 55 lines that are not bugs -- which
# is how a linter trains you to stop reading its output. The goal is that
# `ruff check` reports nothing, so that anything it does report is worth acting
# on. Adopting E501 later means one reflow pass; `line-length` above is already
# set, so `ruff format` would do most of it.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Availability probes: the import *is* the test, so it is unused by design.
# Both already carry noqa comments; this makes the intent declarative.
"src/am_segmentation_manager/io/image.py" = ["F401"]
"src/am_segmentation_manager/operations/label_io.py" = ["F401"]
# Re-export surfaces: names are imported to be part of the public API.
"src/am_segmentation_manager/__init__.py" = ["F401"]
"src/am_segmentation_manager/operations/__init__.py" = ["F401"]

[tool.mypy]
# `mypy` from the repository root checks the package and should report nothing.
files = ["src/am_segmentation_manager"]
python_version = "3.11"
# PyYAML and segmentation_models_pytorch ship no annotations, and torch and
# segmentation_models_pytorch are absent from the main environment; calls into
# them are unchecked rather than reported.
ignore_missing_imports = true

[tool.uv]
# One torch from two indexes: uv needs to know these never appear together, so
# `--extra ml-cuda13` replaces `--extra ml` rather than joining it.
conflicts = [
  [{ extra = "ml" }, { extra = "ml-cuda13" }],
]

# Resolution covers each of these, on each Python version the classifiers name.
# Bounded here rather than in requires-python, which would refuse the core to a
# newer Python outright. A dependency without a wheel for one of them still
# locks, and is built from source there; see `decisions.md` § Environment.
required-environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64' and python_full_version < '3.14'",
  "sys_platform == 'linux' and platform_machine == 'x86_64' and python_full_version < '3.14'",
  "sys_platform == 'darwin' and platform_machine == 'arm64' and python_full_version < '3.14'",
]

# CUDA builds of torch for Windows and Linux. PyPI's Windows torch is CPU-only,
# and its Linux torch needs a driver recent enough for CUDA 13; CUDA 12.6 runs on
# the older drivers shared workstations keep. macOS takes PyPI's, which has MPS.
#
# The CUDA 13 build is the `ml-cuda13` extra rather than the default: it needs a
# driver from 580, which the shared A100 workstations do not have, and it is the
# only build with kernels for a 50-series card.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", extra = "ml-cuda13", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
  { index = "pytorch-cu126", extra = "ml", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu130", extra = "ml-cuda13", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
  { index = "pytorch-cu126", extra = "ml", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

