name: am_segmentation_manager
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pyyaml
  - pandas
  - pytest
  # optional image-processing dependencies (recommended for full functionality)
  - numpy
  - tifffile
  - imagecodecs
  - opencv
  # curation window (`am-seg gui`). qtpy is only an adapter and does nothing on
  # its own: it needs a binding underneath, which is what pyside6 provides.
  # Do not add a second binding (PyQt5) alongside pyside6 -- loading two Qt
  # bindings into one process causes import-time crashes.
  - qtpy
  - pyside6
