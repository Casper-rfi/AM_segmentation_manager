name: am_segmentation_manager
channels:
  - conda-forge
  # Excludes Anaconda's `defaults`/`main` channel even when a local .condarc
  # appends it. Without this the solver mixes the two, and mixing them is not
  # cosmetic: it produced an environment whose opencv came from `main` and
  # whose libprotobuf came from conda-forge, so cv2 failed to load with a
  # missing protobuf symbol. Builds from the two channels are compiled against
  # different ABIs and are not interchangeable.
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - pyyaml
  - pytest
  # Linting and formatting. Configured in pyproject.toml under [tool.ruff];
  # `ruff check` should report nothing, so anything it does report is worth
  # acting on.
  - ruff
  # Type checking. Configured in pyproject.toml under [tool.mypy]; `mypy` run
  # from the repository root should report nothing.
  - mypy
  # Image processing. These are conda builds and are what the optional [all]
  # extra installs from PyPI, so in THIS environment do not also run
  # `pip install -e '.[all]'`: conda's `opencv` and pip's `opencv-python` both
  # provide `cv2`. Same hazard as two Qt bindings, below -- and see the
  # `nodefaults` note above for the channel-mixing version of it, which is
  # what actually broke a real environment.
  - numpy
  - tifffile
  - imagecodecs
  - opencv
  # Charts: the window's Chart button and `am-seg stats --plot`. Not optional
  # in practice any more -- it is in the pip `gui` and `all` extras too -- but
  # the package still runs and declines to chart without it.
  - matplotlib
  # curation window (`am-seg gui`). qtpy is only an adapter and does nothing on
  # its own: it needs a binding underneath, which is what pyside6 provides --
  # the one this package is tested against. Do not add a second binding
  # alongside it; two Qt bindings in one process crash at import.
  - qtpy
  - pyside6
