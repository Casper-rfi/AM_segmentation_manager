name: am_segmentation_manager
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pyyaml
  - pytest
  # Linting and formatting. Configured in pyproject.toml under [tool.ruff];
  # `ruff check` should report nothing, so anything it does report is worth
  # acting on.
  - ruff
  # Image processing. These are conda builds, and they are what the optional
  # [all] extra installs from PyPI -- so in THIS environment do not also run
  # `pip install -e '.[all]'`. conda's `opencv` and pip's `opencv-python` both
  # provide `cv2`; installing both leaves an import that fails, which the
  # package then reports as a missing dependency. Same hazard as two Qt
  # bindings, below.
  - numpy
  - tifffile
  - imagecodecs
  - opencv
  # charts for `am-seg stats --plot`
  - matplotlib
  # curation window (`am-seg gui`). qtpy is only an adapter and does nothing on
  # its own: it needs a binding underneath, which is what pyside6 provides.
  # Do not add a second binding (PyQt5) alongside pyside6 -- loading two Qt
  # bindings into one process causes import-time crashes.
  - qtpy
  - pyside6
